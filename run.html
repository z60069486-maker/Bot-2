<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUN</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background:
        radial-gradient(circle at 50% 20%, #35106b, #120522 45%, #05020b);
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    user-select: none;
}

#game {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    width: 100%;
    max-width: 1000px;
    height: auto;
    max-height: 100vh;
    background: #080310;
    box-shadow: 0 0 40px #8b2cff55;
}

#ui {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: min(94%, 950px);
    display: flex;
    justify-content: space-between;
    z-index: 5;
    pointer-events: none;
}

.stat {
    background: #120b20dd;
    border: 1px solid #a855f755;
    border-radius: 14px;
    padding: 9px 15px;
    font-size: 15px;
}

#startScreen,
#gameOver {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    background: #05020bcc;
    backdrop-filter: blur(6px);
}

.panel {
    width: min(90%, 430px);
    padding: 30px;
    text-align: center;
    border-radius: 25px;
    background: linear-gradient(145deg, #211039ee, #0b0613ee);
    border: 1px solid #a855f766;
    box-shadow: 0 0 35px #8b2cff44;
}

.panel h1 {
    font-size: 54px;
    margin-bottom: 10px;
    color: #d8b4fe;
    text-shadow: 0 0 15px #a855f7;
}

.panel p {
    color: #c4b5fd;
    margin-bottom: 22px;
    line-height: 1.5;
}

button {
    border: none;
    border-radius: 15px;
    padding: 14px 30px;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(135deg, #9333ea, #6d28d9);
    box-shadow: 0 0 15px #9333ea88;
}

button:active {
    transform: scale(.94);
}

.hidden {
    display: none !important;
}

#jumpButton {
    position: fixed;
    bottom: 25px;
    right: 25px;
    z-index: 8;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    font-size: 14px;
    background: radial-gradient(circle, #c084fc, #7e22ce);
    border: 2px solid #e9d5ff;
    box-shadow: 0 0 20px #a855f7;
}

#hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: #a78bfa;
    font-size: 13px;
    opacity: .7;
}

@media(max-width:600px) {
    .stat {
        font-size: 12px;
        padding: 7px 9px;
    }

    #jumpButton {
        width: 76px;
        height: 76px;
        right: 15px;
        bottom: 15px;
    }
}
</style>
</head>

<body>

<div id="game">
    <canvas id="canvas" width="1000" height="600"></canvas>
</div>

<div id="ui">
    <div class="stat">🏃 Счёт: <span id="score">0</span></div>
    <div class="stat">🪙 Монеты: <span id="coins">0</span></div>
    <div class="stat">⚡ Скорость: <span id="speed">10.0</span></div>
</div>

<button id="jumpButton">ПРЫЖОК</button>

<div id="hint">
    SPACE / ТАП — прыжок • можно прыгнуть 2 раза
</div>

<div id="startScreen">
    <div class="panel">
        <h1>RUN</h1>
        <p>
            Беги как можно дальше.<br>
            Прыгай через препятствия,<br>
            собирай монеты и не врежься.
        </p>
        <button id="startButton">НАЧАТЬ</button>
    </div>
</div>

<div id="gameOver" class="hidden">
    <div class="panel">
        <h1>💥</h1>

        <p>
            Ты врезался!<br><br>
            Счёт: <b id="finalScore">0</b><br>
            Монеты: <b id="finalCoins">0</b>
        </p>

        <button id="restartButton">ЕЩЁ РАЗ</button>
    </div>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const coinsText = document.getElementById("coins");
const speedText = document.getElementById("speed");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");

const finalScore = document.getElementById("finalScore");
const finalCoins = document.getElementById("finalCoins");

const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");
const jumpButton = document.getElementById("jumpButton");

const W = canvas.width;
const H = canvas.height;
const groundY = 500;


/* =========================
   ЗВУК
========================= */

let audioCtx = null;

function initAudio() {

    if (!audioCtx) {
        audioCtx = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
}

function playTone(
    frequency,
    duration,
    type = "square",
    volume = 0.08,
    endFrequency = null
) {

    initAudio();

    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    oscillator.type = type;

    oscillator.frequency.setValueAtTime(
        frequency,
        audioCtx.currentTime
    );

    if (endFrequency !== null) {

        oscillator.frequency.linearRampToValueAtTime(
            endFrequency,
            audioCtx.currentTime + duration
        );
    }

    gain.gain.setValueAtTime(
        volume,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime + duration
    );
}

function jumpSound(firstJump) {

    if (firstJump) {

        playTone(
            420,
            0.12,
            "square",
            0.07,
            650
        );

    } else {

        playTone(
            700,
            0.14,
            "triangle",
            0.08,
            1100
        );
    }
}

function coinSound() {

    playTone(
        900,
        0.07,
        "sine",
        0.09,
        1300
    );

    setTimeout(() => {

        playTone(
            1300,
            0.08,
            "sine",
            0.07,
            1600
        );

    }, 50);
}

function deathSound() {

    playTone(
        180,
        0.25,
        "sawtooth",
        0.12,
        60
    );

    setTimeout(() => {

        playTone(
            80,
            0.35,
            "square",
            0.08,
            40
        );

    }, 100);
}

function buttonSound() {

    playTone(
        500,
        0.06,
        "square",
        0.05,
        700
    );
}


/* =========================
   ИГРОК
========================= */

const player = {

    x: 130,
    y: groundY - 48,

    width: 48,
    height: 48,

    velocityY: 0,

    gravity: 0.9,
    jumpPower: -17,

    grounded: true,

    jumps: 0,
    maxJumps: 2,

    rotation: 0
};


/* =========================
   СОСТОЯНИЕ
========================= */

let gameStarted = false;
let gameOver = false;

let score = 0;
let coins = 0;

let speed = 10;

let frame = 0;

let obstacleTimer = 0;
let coinTimer = 0;

let shake = 0;

let obstacles = [];
let coinsList = [];
let particles = [];
let stars = [];


/* =========================
   ЗВЁЗДЫ
========================= */

for (let i = 0; i < 100; i++) {

    stars.push({

        x: Math.random() * W,

        y: Math.random() * 430,

        size: Math.random() * 2 + 1,

        speed: Math.random() * 0.5 + 0.2
    });
}


/* =========================
   СТАРТ
========================= */

function startGame() {

    initAudio();

    buttonSound();

    startScreen.classList.add("hidden");

    resetGame();

    gameStarted = true;
    gameOver = false;

    requestAnimationFrame(loop);
}

function restartGame() {

    initAudio();

    buttonSound();

    gameOverScreen.classList.add("hidden");

    resetGame();

    gameStarted = true;
    gameOver = false;

    requestAnimationFrame(loop);
}


/* =========================
   СБРОС
========================= */

function resetGame() {

    score = 0;
    coins = 0;

    speed = 10;

    frame = 0;

    obstacleTimer = 0;
    coinTimer = 80;

    shake = 0;

    obstacles = [];
    coinsList = [];
    particles = [];

    player.x = 130;
    player.y = groundY - player.height;

    player.velocityY = 0;

    player.grounded = true;

    player.jumps = 0;

    player.rotation = 0;

    scoreText.textContent = "0";
    coinsText.textContent = "0";
    speedText.textContent = "10.0";
}


/* =========================
   ПРЫЖОК
========================= */

function jump() {

    initAudio();

    if (!gameStarted) return;

    if (gameOver) {

        restartGame();

        return;
    }

    if (player.jumps < player.maxJumps) {

        const firstJump =
            player.jumps === 0;

        player.velocityY =
            player.jumpPower;

        player.grounded = false;

        player.jumps++;

        jumpSound(firstJump);

        createJumpParticles();
    }
}


/* =========================
   УПРАВЛЕНИЕ
========================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (e.code === "Space") {

            e.preventDefault();

            jump();
        }
    }
);

canvas.addEventListener(
    "pointerdown",
    function() {

        jump();
    }
);

jumpButton.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        jump();
    }
);

startButton.addEventListener(
    "click",
    startGame
);

restartButton.addEventListener(
    "click",
    restartGame
);


/* =========================
   ЧАСТИЦЫ
========================= */

function createJumpParticles() {

    for (let i = 0; i < 8; i++) {

        particles.push({

            x: player.x + 20,

            y: player.y + player.height,

            vx: -Math.random() * 3,

            vy: Math.random() * 2,

            size: Math.random() * 5 + 2,

            life: 30
        });
    }
}

function createCoinParticles(x, y) {

    for (let i = 0; i < 12; i++) {

        particles.push({

            x: x,

            y: y,

            vx: (Math.random() - 0.5) * 6,

            vy: (Math.random() - 0.5) * 6,

            size: Math.random() * 5 + 2,

            life: 30
        });
    }
}

function createExplosion() {

    for (let i = 0; i < 40; i++) {

        const angle =
            Math.random() * Math.PI * 2;

        const power =
            Math.random() * 8 + 2;

        particles.push({

            x:
                player.x +
                player.width / 2,

            y:
                player.y +
                player.height / 2,

            vx:
                Math.cos(angle) * power,

            vy:
                Math.sin(angle) * power,

            size:
                Math.random() * 8 + 3,

            life: 45
        });
    }
}


/* =========================
   ПРЕПЯТСТВИЯ
========================= */

function spawnObstacle() {

    const type = Math.random();

    if (type < 0.25) {

        obstacles.push({

            type: "spike",

            x: W + 40,

            y: groundY - 45,

            width: 45,

            height: 45
        });

    }

    else if (type < 0.43) {

        obstacles.push({

            type: "double",

            x: W + 40,

            y: groundY - 45,

            width: 95,

            height: 45
        });

    }

    else if (type < 0.58) {

        obstacles.push({

            type: "block",

            x: W + 40,

            y: groundY - 70,

            width: 55,

            height: 70
        });

    }

    else if (type < 0.70) {

        obstacles.push({

            type: "high",

            x: W + 40,

            y: groundY - 105,

            width: 55,

            height: 105
        });

    }

    else if (type < 0.84) {

        obstacles.push({

            type: "triple",

            x: W + 40,

            y: groundY - 45,

            width: 145,

            height: 45
        });

    }

    else {

        obstacles.push({

            type: "combo",

            x: W + 40,

            y: groundY - 105,

            width: 210,

            height: 105
        });
    }
}


/* =========================
   МОНЕТЫ
========================= */

function spawnCoins() {

    const pattern =
        Math.floor(Math.random() * 4);

    if (pattern === 0) {

        for (let i = 0; i < 5; i++) {

            coinsList.push({

                x: W + 50 + i * 45,

                y: groundY - 90,

                radius: 11
            });
        }
    }

    else if (pattern === 1) {

        for (let i = 0; i < 6; i++) {

            coinsList.push({

                x: W + 50 + i * 42,

                y:
                    groundY -
                    100 -
                    Math.sin(
                        i / 5 * Math.PI
                    ) * 100,

                radius: 11
            });
        }
    }

    else if (pattern === 2) {

        for (let i = 0; i < 6; i++) {

            coinsList.push({

                x: W + 50 + i * 45,

                y: groundY - 170,

                radius: 11
            });
        }
    }

    else {

        for (let i = 0; i < 5; i++) {

            coinsList.push({

                x: W + 50 + i * 45,

                y:
                    groundY -
                    100 -
                    i * 25,

                radius: 11
            });
        }
    }
}


/* =========================
   UPDATE
========================= */

function update() {

    frame++;

    score += Math.max(
        1,
        Math.floor(speed / 8)
    );

    scoreText.textContent = score;


    /* ускорение */

    if (frame % 300 === 0) {

        speed += 1;

        if (speed > 25) {
            speed = 25;
        }
    }

    speedText.textContent =
        speed.toFixed(1);


    /* физика */

    player.velocityY +=
        player.gravity;

    player.y +=
        player.velocityY;


    if (
        player.y >=
        groundY - player.height
    ) {

        player.y =
            groundY - player.height;

        player.velocityY = 0;

        player.grounded = true;

        player.jumps = 0;

        player.rotation = 0;

    } else {

        player.grounded = false;

        player.rotation += 0.14;
    }


    /* препятствия */

    obstacleTimer--;

    if (obstacleTimer <= 0) {

        spawnObstacle();

        const minimum =
            Math.max(
                32,
                75 - speed * 2
            );

        obstacleTimer =
            Math.floor(
                minimum +
                Math.random() * 45
            );
    }


    /* монеты */

    coinTimer--;

    if (coinTimer <= 0) {

        spawnCoins();

        coinTimer =
            Math.floor(
                90 +
                Math.random() * 90
            );
    }


    /* движение препятствий */

    for (
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ) {

        const obstacle =
            obstacles[i];

        obstacle.x -= speed;

        if (
            obstacle.x +
            obstacle.width < 0
        ) {

            obstacles.splice(i, 1);

            continue;
        }

        if (
            checkObstacleCollision(
                obstacle
            )
        ) {

            endGame();

            return;
        }
    }


    /* движение монет */

    for (
        let i = coinsList.length - 1;
        i >= 0;
        i--
    ) {

        const coin =
            coinsList[i];

        coin.x -= speed;

        if (coin.x < -30) {

            coinsList.splice(i, 1);

            continue;
        }

        if (
            checkCoinCollision(coin)
        ) {

            coins++;

            coinsText.textContent =
                coins;

            coinSound();

            createCoinParticles(
                coin.x,
                coin.y
            );

            coinsList.splice(i, 1);
        }
    }


    updateParticles();


    if (shake > 0) {

        shake *= 0.88;

        if (shake < 0.5) {
            shake = 0;
        }
    }
}


/* =========================
   КОЛЛИЗИИ
========================= */

function rectCollision(
    ax,
    ay,
    aw,
    ah,
    bx,
    by,
    bw,
    bh
) {

    return (
        ax < bx + bw &&
        ax + aw > bx &&
        ay < by + bh &&
        ay + ah > by
    );
}

function checkObstacleCollision(
    obstacle
) {

    const px =
        player.x + 8;

    const py =
        player.y + 7;

    const pw =
        player.width - 16;

    const ph =
        player.height - 10;


    if (
        obstacle.type === "spike" ||
        obstacle.type === "double" ||
        obstacle.type === "triple"
    ) {

        return rectCollision(
            px,
            py,
            pw,
            ph,
            obstacle.x + 8,
            obstacle.y + 8,
            obstacle.width - 16,
            obstacle.height - 8
        );
    }


    if (
        obstacle.type === "block" ||
        obstacle.type === "high"
    ) {

        return rectCollision(
            px,
            py,
            pw,
            ph,
            obstacle.x,
            obstacle.y,
            obstacle.width,
            obstacle.height
        );
    }


    if (obstacle.type === "combo") {

        return (
            rectCollision(
                px,
                py,
                pw,
                ph,
                obstacle.x,
                obstacle.y,
                55,
                105
            ) ||

            rectCollision(
                px,
                py,
                pw,
                ph,
                obstacle.x + 75,
                groundY - 45,
                135,
                45
            )
        );
    }

    return false;
}

function checkCoinCollision(coin) {

    const centerX =
        player.x +
        player.width / 2;

    const centerY =
        player.y +
        player.height / 2;

    const distance =
        Math.hypot(
            centerX - coin.x,
            centerY - coin.y
        );

    return distance < 32;
}


/* =========================
   ЧАСТИЦЫ
========================= */

function updateParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.x += p.vx;

        p.y += p.vy;

        p.vy += 0.12;

        p.life--;

        if (p.life <= 0) {

            particles.splice(i, 1);
        }
    }
}


/* =========================
   DRAW
========================= */

function draw() {

    ctx.save();

    if (shake > 0) {

        ctx.translate(
            (Math.random() - 0.5) * shake,
            (Math.random() - 0.5) * shake
        );
    }

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawBackground();

    drawGround();

    drawCoins();

    drawObstacles();

    drawPlayer();

    drawParticles();

    ctx.restore();
}


/* =========================
   ФОН
========================= */

function drawBackground() {

    for (const star of stars) {

        star.x -= star.speed;

        if (star.x < 0) {
            star.x = W;
        }

        ctx.globalAlpha = 0.4;

        ctx.fillStyle = "#ffffff";

        ctx.fillRect(
            star.x,
            star.y,
            star.size,
            star.size
        );
    }

    ctx.globalAlpha = 1;


    for (let i = 0; i < 8; i++) {

        const x =
            (
                i * 170 -
                frame * speed * 0.15
            ) %
            (W + 200);

        ctx.fillStyle =
            "#32104d";

        ctx.beginPath();

        ctx.moveTo(
            x,
            groundY
        );

        ctx.lineTo(
            x + 90,
            330
        );

        ctx.lineTo(
            x + 180,
            groundY
        );

        ctx.closePath();

        ctx.fill();
    }
}


/* =========================
   ЗЕМЛЯ
========================= */

function drawGround() {

    ctx.fillStyle =
        "#160b25";

    ctx.fillRect(
        0,
        groundY,
        W,
        H - groundY
    );

    ctx.fillStyle =
        "#9333ea";

    ctx.fillRect(
        0,
        groundY,
        W,
        4
    );

    ctx.globalAlpha = 0.25;

    for (
        let x = 0;
        x < W;
        x += 50
    ) {

        const offset =
            (
                frame *
                speed *
                0.8
            ) % 50;

        ctx.fillStyle =
            "#a855f7";

        ctx.fillRect(
            x - offset,
            groundY + 25,
            25,
            3
        );
    }

    ctx.globalAlpha = 1;
}


/* =========================
   ИГРОК
========================= */

function drawPlayer() {

    const cx =
        player.x +
        player.width / 2;

    const cy =
        player.y +
        player.height / 2;

    ctx.save();

    ctx.translate(
        cx,
        cy
    );

    ctx.rotate(
        player.rotation
    );

    ctx.shadowBlur = 20;

    ctx.shadowColor =
        "#c084fc";

    const gradient =
        ctx.createLinearGradient(
            -24,
            -24,
            24,
            24
        );

    gradient.addColorStop(
        0,
        "#f0abfc"
    );

    gradient.addColorStop(
        0.5,
        "#c084fc"
    );

    gradient.addColorStop(
        1,
        "#7e22ce"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        -24,
        -24,
        48,
        48
    );

    ctx.shadowBlur = 0;

    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        -12,
        -10,
        8,
        8
    );

    ctx.fillRect(
        5,
        -10,
        8,
        8
    );

    ctx.fillStyle =
        "#581c87";

    ctx.fillRect(
        -11,
        7,
        22,
        5
    );

    ctx.restore();
}


/* =========================
   ПРЕПЯТСТВИЯ
========================= */

function drawObstacles() {

    for (const obstacle of obstacles) {

        if (
            obstacle.type === "spike" ||
            obstacle.type === "double" ||
            obstacle.type === "triple"
        ) {

            const count =
                obstacle.type === "spike"
                    ? 1
                    : obstacle.type === "double"
                        ? 2
                        : 3;

            const width =
                obstacle.width / count;

            for (
                let i = 0;
                i < count;
                i++
            ) {

                drawSpike(
                    obstacle.x +
                    i * width,

                    obstacle.y,

                    width,

                    obstacle.height
                );
            }
        }

        else if (
            obstacle.type === "block" ||
            obstacle.type === "high"
        ) {

            drawBlock(
                obstacle.x,
                obstacle.y,
                obstacle.width,
                obstacle.height
            );
        }

        else {

            drawBlock(
                obstacle.x,
                obstacle.y,
                55,
                105
            );

            drawSpike(
                obstacle.x + 75,
                groundY - 45,
                135,
                45
            );
        }
    }
}

function drawSpike(
    x,
    y,
    width,
    height
) {

    ctx.save();

    ctx.shadowBlur = 15;

    ctx.shadowColor =
        "#ef4444";

    const gradient =
        ctx.createLinearGradient(
            x,
            y,
            x,
            y + height
        );

    gradient.addColorStop(
        0,
        "#fb7185"
    );

    gradient.addColorStop(
        1,
        "#991b1b"
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.moveTo(
        x,
        y + height
    );

    ctx.lineTo(
        x + width / 2,
        y
    );

    ctx.lineTo(
        x + width,
        y + height
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();
}

function drawBlock(
    x,
    y,
    width,
    height
) {

    ctx.save();

    ctx.shadowBlur = 15;

    ctx.shadowColor =
        "#f97316";

    const gradient =
        ctx.createLinearGradient(
            x,
            y,
            x + width,
            y + height
        );

    gradient.addColorStop(
        0,
        "#fb923c"
    );

    gradient.addColorStop(
        1,
        "#9a3412"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        x,
        y,
        width,
        height
    );

    ctx.strokeStyle =
        "#fed7aa";

    ctx.lineWidth = 2;

    ctx.strokeRect(
        x,
        y,
        width,
        height
    );

    ctx.restore();
}


/* =========================
   МОНЕТЫ
========================= */

function drawCoins() {

    for (const coin of coinsList) {

        ctx.save();

        ctx.translate(
            coin.x,
            coin.y
        );

        ctx.rotate(
            frame * 0.05
        );

        ctx.shadowBlur = 18;

        ctx.shadowColor =
            "#facc15";

        ctx.fillStyle =
            "#facc15";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            coin.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle =
            "#fff7ed";

        ctx.font =
            "bold 12px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "$",
            0,
            1
        );

        ctx.restore();
    }
}


/* =========================
   ЧАСТИЦЫ
========================= */

function drawParticles() {

    for (const p of particles) {

        ctx.globalAlpha =
            Math.max(
                0,
                p.life / 45
            );

        ctx.fillStyle =
            "#c084fc";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


/* =========================
   СМЕРТЬ
========================= */

function endGame() {

    gameOver = true;

    gameStarted = false;

    deathSound();

    shake = 20;

    createExplosion();

    finalScore.textContent =
        score;

    finalCoins.textContent =
        coins;

    gameOverScreen.classList.remove(
        "hidden"
    );
}


/* =========================
   LOOP
========================= */

function loop() {

    if (!gameStarted) {

        draw();

        return;
    }

    update();

    draw();

    if (!gameOver) {

        requestAnimationFrame(
            loop
        );
    }
}


/* =========================
   ЗАПУСК
========================= */

draw();

</script>
